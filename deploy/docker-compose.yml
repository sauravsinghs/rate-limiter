# deploy/docker-compose.yml
# Alternative compose file for deployment (same as root, kept for backwards compat)
# Usage:  cd deploy && docker-compose up --build
# Or from root:  docker-compose up --build

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend-runner
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - BUCKET_CAPACITY=10
      - REFILL_RATE=1.0
      - TOKENS_PER_REQUEST=1
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frontend-runner
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
