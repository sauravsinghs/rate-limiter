name: Deploy Rate Limiter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Build frontend
        run: cd frontend && npm run build
      
      - name: Test backend
        run: cd backend && npm test || echo "No tests configured yet"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Post-deploy health smoke check
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          target_url="$RENDER_HEALTHCHECK_URL"

          if [ -z "$target_url" ] && [ -n "$RENDER_SERVICE_URL" ]; then
            target_url="${RENDER_SERVICE_URL%/}/api/health"
          fi

          if [ -z "$target_url" ]; then
            echo "RENDER_HEALTHCHECK_URL (preferred) or RENDER_SERVICE_URL not configured; skipping smoke check."
            exit 0
          fi

          echo "Polling $target_url for readiness..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$target_url")
            if [ "$code" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i/20: received HTTP $code, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after retries."
          exit 1
